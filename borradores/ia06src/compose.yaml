name: ia06-voz

services:
  # La agenda del consultorio. Es lo único que corre en Docker: la voz corre en tu máquina.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consultorio
    ports:
      - "127.0.0.1:55438:5432"   # solo desde tu máquina, y en un puerto que no choca con IA01 a IA05
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # corre solo con el volumen vacío
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consultorio"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
