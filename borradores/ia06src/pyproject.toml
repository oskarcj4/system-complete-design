[project]
name = "ia06-voz"
version = "0.1.0"
description = "Un agente de voz que agenda citas: Whisper, Claude u Ollama y Piper en Pipecat, con confirmación hablada y una agenda que no se pisa."
requires-python = ">=3.13"
dependencies = [
    "pipecat-ai[anthropic,webrtc,runner,whisper,piper]==1.16.0",  # la tubería de voz, el navegador por WebRTC y los modelos locales
    "psycopg[binary]==3.3.6",                # PostgreSQL
    "tzdata==2026.6",                        # las zonas horarias; Windows no las trae
    "langchain==1.4.3",                      # init_chat_model, solo para los evals en texto
    "langchain-anthropic==1.7.5",            # Claude en los evals
    "langchain-ollama==1.1.0",               # el modelo local en los evals
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
voz-latencias = "voz.latencia:main"
voz-evals = "evals.dialogos:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voz", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
