[project]
name = "ml00-laboratorio"
version = "0.1.0"
description = "El laboratorio de recomendación: MovieLens en Parquet, una partición por tiempo y las métricas offline."
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.4",     # arreglos y cuentas
    "pandas==3.0.6",    # tablas en memoria (DataFrame)
    "pyarrow==26.0.0",  # leer y escribir Parquet
    "scipy==1.18.1",    # la matriz dispersa (CSR)
    "duckdb==1.5.6",    # SQL sobre los Parquet, sin servidor
]

[dependency-groups]
dev = ["pytest==9.1.1", "hypothesis==6.170.1"]
[project.scripts]
reco = "reco.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reco"]

[tool.pytest.ini_options]
testpaths = ["tests"]