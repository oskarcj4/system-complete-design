[project]
name = "ia03-soporte"
version = "0.1.0"
description = "Un soporte con LangGraph que clasifica, enruta, consulta pedidos con RLS y reembolsa con una clave de idempotencia."
requires-python = ">=3.13"
dependencies = [
    "langgraph==1.2.13",                     # el grafo, interrupt y Command
    "langgraph-checkpoint-postgres==3.1.2",  # PostgresSaver: el ticket sobrevive a un reinicio
    "langchain==1.4.3",                      # init_chat_model
    "langchain-anthropic==1.7.5",            # Claude
    "langchain-ollama==1.1.0",               # el modelo local y los embeddings
    "psycopg[binary,pool]==3.3.6",           # PostgreSQL
    "pgvector==0.5.0",                       # el tipo vector en psycopg
    "httpx==0.28.1",                         # el proveedor de pagos
    "fastapi==0.143.0",                      # la API de tickets
    "uvicorn==0.54.0",                       # el servidor de la API
]

[project.optional-dependencies]
trazas = [
    "arize-phoenix-otel==0.17.2",
    "openinference-instrumentation-langchain==0.1.78",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
soporte = "soporte.cli:main"
soporte-api = "soporte.api:main"
soporte-indexar = "soporte.indexar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soporte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
