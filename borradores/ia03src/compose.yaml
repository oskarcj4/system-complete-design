name: ia03-soporte

services:
  # Una instancia con dos bases: tienda (pedidos, con RLS) y soporte (tickets, acciones y checkpoints).
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55435:5432"   # solo desde tu máquina, y en un puerto que no choca con IA01 ni IA02
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # corre solo con el volumen vacío
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  # El proveedor de pagos, de mentira, con su almacén de claves de idempotencia en memoria.
  pagos:
    build: ./pagos
    ports:
      - "127.0.0.1:8013:8013"

  # Las traces del agente: la interfaz y el receptor OTLP, en el 6003 de tu máquina.
  phoenix:
    image: arizephoenix/phoenix:20.19.0
    ports:
      - "127.0.0.1:6003:6006"

volumes:
  pgdata:
