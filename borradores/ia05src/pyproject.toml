[project]
name = "ia05-docs"
version = "0.1.0"
description = "Preguntas sobre la documentación con citas que se comprueban: troceado, búsqueda híbrida en pgvector, re-ranking y evals con un juez calibrado."
requires-python = ">=3.13"
dependencies = [
    "langchain==1.4.3",                      # init_chat_model y la salida estructurada
    "langchain-anthropic==1.7.5",            # Claude
    "langchain-ollama==1.1.0",               # el modelo local y los embeddings
    "psycopg[binary]==3.3.6",                # PostgreSQL
    "pgvector==0.5.0",                       # el tipo vector en psycopg
    "httpx==0.28.1",                         # bajar las páginas del curso
    "fastapi==0.143.0",                      # la API de preguntas
    "uvicorn==0.54.0",                       # el servidor de la API
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
docs = "docs.cli:main"
docs-api = "docs.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
