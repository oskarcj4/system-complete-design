name: ia05-docs

services:
  # Una sola base: los trozos, sus embeddings y su texto para la búsqueda léxica.
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55437:5432"   # solo desde tu máquina, y en un puerto que no choca con IA01 a IA04
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # corre solo con el volumen vacío
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
