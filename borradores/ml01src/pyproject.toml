[project]
name = "ml01-linea-base"
version = "0.1.0"
description = "La línea base: lo popular de cuatro maneras, medido con intervalos y servido con caché."
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "duckdb==1.5.6",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "redis==8.1.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "hypothesis==6.170.1", "httpx==0.28.1"]
[project.scripts]
reco = "reco.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reco"]

[tool.pytest.ini_options]
testpaths = ["tests"]