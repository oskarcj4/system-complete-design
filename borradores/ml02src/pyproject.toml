[project]
name = "ml02-comprados-juntos"
version = "0.1.0"
description = "Comprados juntos: filtrado colaborativo ítem a ítem, medido contra la línea base y servido con Redis."
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.5",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "scipy==1.18.1",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "redis==8.2.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "hypothesis==6.170.17", "httpx==0.29.0"]

[project.scripts]
reco = "reco.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
