name: ml02

services:
  redis:
    image: redis:8.10.2
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction",
              "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
